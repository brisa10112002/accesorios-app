<div class="login-container">
  <div class="login-box">
    <p class="login-sub">Bienvenida</p>
    <h2 class="login-titulo">Iniciá sesión</h2>

    @if (enviado) {
      <div class="login-mensaje">
        ¡Sesión iniciada correctamente!
      </div>
    }

    <div class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" placeholder="••••••••">
      </div>

      <button class="btn-ingresar" (click)="iniciarSesion()">Ingresar</button>

      <p class="login-volver">
        <a routerLink="/principal">Volver al inicio</a>
      </p>
    </div>
  </div>
</div>
