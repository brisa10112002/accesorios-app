<section class="banner" aria-label="Novedades de MAJOMO">
  <a routerLink="/catalogo" class="banner-slide slide1">
    <img src="imagenes/hero1.jpg" alt="Aros y collares plateados. 3 cuotas sin interés, envíos a todo el país.">
  </a>
  <a routerLink="/catalogo" class="banner-slide slide2">
    <img src="imagenes/hero2.jpg" alt="Collar con dije de mariposa. Encontrá tus nuevas joyitas favoritas.">
  </a>
</section>

<section class="pagina">
  <div class="seccion-cabecera">
    <h2 class="seccion-titulo">Comprá por categoría</h2>
    <a routerLink="/catalogo" class="ver-todo">Ver todo el catálogo</a>
  </div>

  <div class="categorias">
    @for (categoria of categorias; track categoria.nombre) {
      <a routerLink="/catalogo" class="categoria">
        <div class="categoria-img">
          <img [src]="categoria.imagen" [alt]="categoria.nombre">
        </div>
        <span>{{ categoria.nombre }}</span>
      </a>
    }
  </div>
</section>

<section class="pagina">
  <h2 class="seccion-titulo">Preguntas frecuentes</h2>

  <div class="preguntas">
    @for (item of preguntas; track item.pregunta) {
      <details class="pregunta">
        <summary>{{ item.pregunta }}</summary>
        <p>{{ item.respuesta }}</p>
      </details>
    }
  </div>
</section>
